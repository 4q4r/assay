# Tag-triggered release (R2): fires on exact semver tags and semver
# pre-release suffixes only (v1.2.3, v1.2.3-rc1, v1.2.3-beta.1); rejects
# non-semver tags (v1.2, nightly). goreleaser runs the full pipeline from
# .goreleaser.yaml, including the per-arch smoke hook.
name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  release:
    permissions:
      # Create the GitHub Release and upload assets; write is granted at
      # job level only (workflow level stays read).
      contents: write
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 is mandatory: the changelog needs full tag history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # qemu-user provides the user-mode emulator binaries the smoke hook
      # invokes: /usr/bin/qemu-aarch64, /usr/bin/qemu-arm, /usr/bin/qemu-i386
      # (file list: https://packages.ubuntu.com/resolute/qemu-user). On
      # ubuntu-26.04 (resolute) NO package ships the legacy "-static"-suffixed
      # names: qemu-user-static is a virtual package there (provided by
      # qemu-user-binfmt), so the v0.1.0 run failed with exit 127
      # "qemu-aarch64-static: not found" — the smoke script invoked a name
      # that does not exist on this image. qemu-user is listed explicitly
      # even though qemu-user-binfmt depends on it, so the emulator binaries
      # cannot vanish from the job if the registration package is ever
      # reorganized. amd64 smokes natively. NOT docker/setup-qemu-action,
      # whose binfmt handlers register for container exec only.
      - name: install qemu-user emulators + binfmt registration
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends qemu-user qemu-user-binfmt
      - name: goreleaser release
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
