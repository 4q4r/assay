# assay default configuration — materialized by `assay install`
# (W13-deploy deploy layout). This file IS the default config: without -c
# every command resolves to it first (one file wins whole — nothing is ever
# merged). A re-install NEVER overwrites it; `assay uninstall --purge`
# removes it along with the data dir. Edit in place.

data_dir = '{{ .DataDir }}'

[probe]
# Throughput measurement per probe wave — default OFF (round-8 owner
# ruling, «Только спидтест выключи»: refresh waves are probe-only). The
# dedicated weekly speedtest wave ([maintain].speedtest_interval) carries
# the -S semantics regardless; set true to speedtest on EVERY wave.
# speedtest = true

[maintain]
refresh_interval = "1h"
# Speedtest wave recheck — default 168h (weekly, floor 5m). "0s" disables
# the speedtest wave entirely (refresh waves stay probe-only).
# speedtest_interval = "168h"

[core]
# The self-held core (the 2026-11-10 pivot, D1/D2): the daemon supervises
# its OWN xray process with its own proxy inbounds; this section is that
# process's knob surface. The full schema lives in config.example.toml
# (the repository's documented example); the materialized defaults are
# shown here.
# xray_bin = ""              # the SINGLE binary knob (S1): empty = the managed
                            # default <data>/bin/xray (installed by `assay install`);
                            # a system xray may be pointed at instead — core
                            # auto-update goes inert there with a one-time loud
                            # INFO (S5)
# auto_update = true         # managed-core auto-update, default ON (D4, managed
                            # core only per S5)
socks_port = 10810          # own socks5 inbound, loopback-only (D2)
http_port = 10811           # own http inbound, loopback-only (D2)
api_port = 15491            # own stats/API inbound, loopback-only

[render]
# The render target is FIXED: the own core's generated config lives at
# <data>/rendered/live.json — there is no template or output-path knob
# (S4). The surviving knobs (observatory_interval, tcp_max_seg,
# tls_fingerprint, balancer_tolerance, pool_routes) default correctly and
# are documented in config.example.toml.

[activate]
# Activation drives the OWN core (D3): -test gate on the candidate →
# date-stamped backup → atomic replace of live.json → the core manager
# restarts the core on it. The binary knob is [core].xray_bin (S1); the
# surviving knobs (test_timeout, backup_keep) default correctly and are
# documented in config.example.toml. Backups live at the FIXED
# <data>/backups — the D8 rollback restores from exactly there.
